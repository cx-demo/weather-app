<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple five-day weather forecast with city search.">
  <title>Weather forecast</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page: #e8f4f5;
      --page-alt: #f7fbfb;
      --card: #ffffff;
      --ink: #123047;
      --muted: #627d98;
      --line: #d7e8eb;
      --accent: #168aad;
      --accent-soft: #d9f3f2;
      --shadow: 0 24px 60px rgb(22 78 99 / 12%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, var(--page), var(--page-alt) 55%, #dff7f3);
    }
    main { width: min(calc(100% - 32px), 620px); margin: 0 auto; padding: 42px 0 56px; }
    .eyebrow { color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 24px; font-size: clamp(2.3rem, 8vw, 3.5rem); line-height: 1; letter-spacing: -.07em; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input, button { border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; font: inherit; }
    input { min-width: 0; flex: 1; color: inherit; background: var(--card); }
    button { cursor: pointer; border-color: var(--ink); color: #fff; background: var(--ink); font-weight: 800; }
    button:disabled { cursor: wait; opacity: .65; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .status { min-height: 28px; color: var(--muted); font-size: .86rem; }
    .weather-card { --accent: #168aad; --accent-soft: #d9f3f2; background: var(--card); border: 1px solid rgb(255 255 255 / 70%); border-radius: 28px; padding: 26px; box-shadow: var(--shadow); }
    .weather-card[data-kind="sun"] { --accent: #d97706; --accent-soft: #fef3c7; }
    .weather-card[data-kind="rain"] { --accent: #2563eb; --accent-soft: #dbeafe; }
    .weather-card[data-kind="snow"] { --accent: #0891b2; --accent-soft: #cffafe; }
    .weather-card[data-kind="storm"] { --accent: #7c3aed; --accent-soft: #ede9fe; }
    .location { display: flex; justify-content: space-between; gap: 16px; font-weight: 800; }
    .location small { display: block; margin-top: 3px; color: var(--muted); font-size: .78rem; font-weight: 600; }
    .today { text-align: right; color: var(--muted); font-size: .82rem; }
    .reading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 24px 0 6px; }
    .temperature { font-size: 5.4rem; line-height: .95; letter-spacing: -.1em; font-weight: 850; }
    .condition-icon { font-size: 3.4rem; }
    .condition { color: var(--accent); font-size: 1.1rem; font-weight: 850; }
    .details { display: flex; gap: 20px; margin-top: 19px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
    .forecast-heading { margin: 22px 0 10px; color: var(--muted); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; }
    .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .day { min-width: 0; padding: 14px 8px; border-radius: 18px; background: var(--accent-soft); text-align: center; }
    .day b { display: block; font-size: .78rem; }
    .day .icon { margin: 10px 0; font-size: 1.65rem; }
    .day strong { display: block; font-size: .92rem; }
    .day small { color: var(--muted); font-size: .78rem; }
    .source { margin: 18px 0 0; color: var(--muted); font-size: .76rem; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #0b2638; --page-alt: #102a43; --card: #173b56; --ink: #e7f5ff; --muted: #a7c4d8; --line: #31556b; --shadow: 0 24px 60px rgb(0 0 0 / 30%); }
      body { background: linear-gradient(145deg, var(--page), var(--page-alt) 60%, #123d4a); }
      .weather-card { border-color: rgb(255 255 255 / 8%); }
      .day { background: color-mix(in srgb, var(--accent-soft) 22%, var(--card)); }
      button { background: #7de2d1; border-color: #7de2d1; color: #102a43; }
    }
    @media (max-width: 430px) {
      main { padding-top: 28px; }
      .weather-card { padding: 21px; }
      .temperature { font-size: 4.5rem; }
      .forecast { gap: 4px; }
      .day { padding-inline: 3px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Weather desk</div>
    <h1>Weather,<br>right now.</h1>
    <form id="search-form">
      <label class="sr-only" for="city">Search for a city</label>
      <input id="city" name="city" autocomplete="address-level2" value="Tokyo" placeholder="Search a city">
      <button id="search-button" type="submit">Search</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="weather-card" class="weather-card" data-kind="cloud" aria-live="polite">
      <div class="location">
        <div><span id="place">Tokyo, Japan</span><small id="updated">Today</small></div>
        <div id="timezone" class="today">Local time</div>
      </div>
      <div class="reading">
        <div id="temperature" class="temperature">22°</div>
        <div id="condition-icon" class="condition-icon" aria-hidden="true">⛅</div>
      </div>
      <div id="condition" class="condition">Partly cloudy</div>
      <div class="details"><span id="feels">Feels like 23°</span><span id="wind">Wind 12 km/h</span></div>
      <div class="forecast-heading">Five-day outlook</div>
      <div id="forecast" class="forecast"></div>
    </section>
    <p class="source">Live forecast via Open-Meteo. A local fallback keeps the view useful offline.</p>
  </main>
  <script>
    const fallback = {
      name: "Tokyo, Japan", temp: 22, feels: 23, wind: 12, summary: "Partly cloudy", icon: "⛅", kind: "cloud",
      days: [["Tue", "☀️", "24°", "18°"], ["Wed", "⛅", "23°", "17°"], ["Thu", "🌧️", "20°", "16°"], ["Fri", "☀️", "25°", "18°"], ["Sat", "⛅", "24°", "19°"]]
    };
    const conditions = {
      0: ["Clear sky", "☀️", "sun"], 1: ["Mainly clear", "🌤️", "sun"], 2: ["Partly cloudy", "⛅", "cloud"], 3: ["Overcast", "☁️", "cloud"],
      45: ["Fog", "🌫️", "cloud"], 48: ["Rime fog", "🌫️", "cloud"], 51: ["Drizzle", "🌦️", "rain"], 53: ["Drizzle", "🌦️", "rain"],
      55: ["Drizzle", "🌦️", "rain"], 61: ["Rain", "🌧️", "rain"], 63: ["Rain", "🌧️", "rain"], 65: ["Heavy rain", "🌧️", "rain"],
      71: ["Snow", "🌨️", "snow"], 73: ["Snow", "🌨️", "snow"], 75: ["Heavy snow", "🌨️", "snow"], 80: ["Showers", "🌦️", "rain"],
      81: ["Showers", "🌦️", "rain"], 82: ["Heavy showers", "🌧️", "rain"], 95: ["Thunderstorm", "⛈️", "storm"], 96: ["Thunderstorm", "⛈️", "storm"], 99: ["Thunderstorm", "⛈️", "storm"]
    };
    const $ = (id) => document.getElementById(id);
    const conditionFor = (code) => conditions[code] || ["Changeable", "🌤️", "cloud"];
    const validForecast = (data) => data && data.current && Number.isFinite(data.current.temperature_2m) && Number.isFinite(data.current.weather_code)
      && data.daily && Array.isArray(data.daily.time) && data.daily.time.length >= 5
      && Array.isArray(data.daily.weather_code) && data.daily.weather_code.length >= 5
      && Array.isArray(data.daily.temperature_2m_max) && data.daily.temperature_2m_max.length >= 5
      && Array.isArray(data.daily.temperature_2m_min) && data.daily.temperature_2m_min.length >= 5;
    function render(weather) {
      const card = $("weather-card");
      card.dataset.kind = weather.kind;
      $("place").textContent = weather.name;
      $("updated").textContent = weather.offline ? "Offline fallback" : "Today";
      $("timezone").textContent = weather.timezone || "Local time";
      $("temperature").textContent = `${Math.round(weather.temp)}°`;
      $("condition-icon").textContent = weather.icon;
      $("condition").textContent = weather.summary;
      $("feels").textContent = `Feels like ${Math.round(weather.feels)}°`;
      $("wind").textContent = `Wind ${Math.round(weather.wind)} km/h`;
      $("forecast").innerHTML = weather.days.map(([day, icon, high, low, label]) =>
        `<article class="day"><b>${day}</b><div class="icon" aria-hidden="true">${icon}</div><strong>${high}</strong><small>${low}${label ? ` · ${label}` : ""}</small></article>`
      ).join("");
    }
    function normalize(place, data) {
      if (!validForecast(data)) throw new Error("Incomplete forecast");
      const current = conditionFor(data.current.weather_code);
      return {
        name: [place.name, place.country].filter(Boolean).join(", "),
        temp: data.current.temperature_2m, feels: Number(data.current.apparent_temperature) || data.current.temperature_2m,
        wind: Number(data.current.wind_speed_10m) || 0, summary: current[0], icon: current[1], kind: current[2],
        timezone: data.timezone || "Local time",
        days: data.daily.time.slice(0, 5).map((date, index) => {
          const day = new Date(`${date}T12:00:00`).toLocaleDateString("en", { weekday: "short" });
          const daily = conditionFor(data.daily.weather_code[index]);
          return [day, daily[1], `${Math.round(data.daily.temperature_2m_max[index])}°`, `${Math.round(data.daily.temperature_2m_min[index])}°`, daily[0]];
        })
      };
    }
    let inFlight = false;
    async function loadWeather(query) {
      if (inFlight) return;
      inFlight = true; $("search-button").disabled = true; $("status").textContent = "Finding live conditions…";
      try {
        const geocode = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`).then((response) => {
          if (!response.ok) throw new Error("Geocoding failed");
          return response.json();
        });
        const place = geocode.results && geocode.results[0];
        if (!place) throw new Error("City not found");
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto`;
        const forecast = await fetch(url).then((response) => {
          if (!response.ok) throw new Error("Forecast failed");
          return response.json();
        });
        render(normalize(place, forecast)); $("status").textContent = "Live conditions updated.";
      } catch (error) {
        $("status").textContent = "Live data unavailable — showing the local fallback.";
        render({ ...fallback, name: query === "Tokyo" ? fallback.name : `${query} (offline)`, offline: true });
      } finally {
        inFlight = false; $("search-button").disabled = false;
      }
    }
    $("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const query = $("city").value.trim();
      if (!query) { $("status").textContent = "Enter a city to search."; return; }
      loadWeather(query);
    });
    render(fallback);
    loadWeather("Tokyo");
  </script>
</body>
</html>
